<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eğitimim | Gülçin Torlakcık</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .sayfa {
            width: 90%;
            max-width: 900px;
            min-height: 600px;
            margin: 50px auto;
            background: white;
            padding: 50px;
            border-radius: 25px;
        }

        h1 {
            text-align: center;
            font-size: 40px;
            margin-bottom: 45px;
        }

        .egitim-listesi {
            max-width: 650px;
            margin: auto;
        }

        .egitim-item {
            padding: 18px 20px;
            margin-bottom: 15px;
            background: #eeeeee;
            border-left: 5px solid #4b515a;
            border-radius: 10px;
            font-size: 18px;
        }

        .okul {
            font-weight: bold;
        }

        .geri {
            display: block;
            width: fit-content;
            margin: 45px auto 0;
            padding: 14px 28px;
            background: #333b48;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .geri:hover {
            background: #555e69;
            transform: scale(1.05);
        }
    </style>

</head>

<body>

    <div class="sayfa">

        <h1>Eğitimim</h1>

        <div class="egitim-listesi">

            <div class="egitim-item">
                <span class="okul">İstek Acıbadem</span>
                – İlkokul
            </div>

            <div class="egitim-item">
                <span class="okul">Nihat Işık Ortaokulu</span>
            </div>

            <div class="egitim-item">
                <span class="okul">Üsküdar Çağrıbey Anadolu Lisesi</span>
            </div>

            <div class="egitim-item">
                <span class="okul">İntaş Lisesi</span>
            </div>

            <div class="egitim-item">
                <span class="okul">Kadir Has Üniversitesi</span>
                – Halkla İlişkiler ve Reklam
            </div>

        </div>

        <a class="geri" href="index.html">
            ← Ana Sayfaya Dön
        </a>

    </div>

</body>

</html>
