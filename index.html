<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gülçin Torlakcık | CV</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: white;
    color: #222;
    overflow: hidden;
}

/* =========================
   ANA ALAN
========================= */

.ana-sayfa {
    width: 100%;
    height: 100vh;
    position: relative;
}

/* =========================
   BAŞLIK
========================= */

header {
    text-align: center;
    padding-top: 30px;
}

.baslik-satiri {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
}

.baslik-satiri h1 {
    margin: 0;
    font-size: 42px;
    font-weight: 600;
    color: #333b48;
}

.baslik-pati {
    width: 55px;
    height: 55px;
    object-fit: contain;
    display: block;
}

.baslik-kalp {
    width: 50px;
    height: 50px;
    object-fit: contain;
    display: block;
}

.unvan {
    margin-top: 8px;
    color: #777;
    font-size: 18px;
}

/* =========================
   ORTA ÇALIŞMA ALANI
========================= */

.sahne {
    position: absolute;
    width: 900px;
    height: 560px;
    left: 50%;
    top: 125px;
    transform: translateX(-50%);
}

/* =========================
   ÇOCUKLAR
========================= */

.cocuklar {
    position: absolute;
    width: 140px;
    height: auto;
    left: 50%;
    top: -5px;
    transform: translateX(-50%);
    display: block;
    z-index: 1;
}

/* =========================
   FOTOĞRAF
========================= */

.foto-alani {
    position: absolute;
    width: 200px;
    height: 200px;
    left: 50%;
    top: 130px;
    transform: translateX(-50%);
}

.foto-cerceve {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid #4b515a;
    overflow: hidden;
    background: white;
}

.foto-cerceve img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* =========================
   BUTONLAR
========================= */

.buton {
    position: absolute;
    display: block;
    text-decoration: none;
    color: white;
    background: #333b48;
    padding: 15px 28px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    white-space: nowrap;
    cursor: pointer;
    transition: 0.25s;
}

.buton:hover {
    background: #555e69;
    transform: scale(1.05);
}

/* =========================
   HAKKIMDA
========================= */

.hakkimda {
    left: 50%;
    top: 65px;
    transform: translateX(-50%);
}

.hakkimda:hover {
    transform: translateX(-50%) scale(1.05);
}

/* =========================
   DENEYİMLERİM
========================= */

.deneyimler {
    left: 150px;
    top: 215px;
    transform: translateY(-50%);
}

.deneyimler:hover {
    transform: translateY(-50%) scale(1.05);
}

/* =========================
   PROGRAMLAR
========================= */

.programlar {
    right: 165px;
    top: 215px;
    transform: translateY(-50%);
}

.programlar:hover {
    transform: translateY(-50%) scale(1.05);
}

/* =========================
   EĞİTİMİM
========================= */

.egitim {
    left: 50%;
    top: 340px;
    transform: translateX(-50%);
}

.egitim:hover {
    transform: translateX(-50%) scale(1.05);
}

/* =========================
   KEDİ
========================= */

.kedi {
    position: absolute;
    width: 85px;
    height: auto;
    left: 50%;
    top: 393px;
    transform: translateX(-50%);
    display: block;
}

/* =========================
   NOT DEFTERİ
========================= */

.not-defteri {
    position: absolute;
    width: 270px;
    height: auto;
    left: 45px;
    bottom: 15px;
    display: block;
    z-index: 1;
}

/* =========================
   KALEM
========================= */

.kalem {
    position: fixed;
    width: 160px;
    height: auto;
    right: 170px;
    bottom: 20px;
    display: block;
    z-index: 5;
    pointer-events: none;
}

/* =========================
   SIZE NE KATABİLİRİM?
========================= */

.size-ne-katabilirim {
    left: 50%;
    top: 447px;
    transform: translateX(-50%);
}

.size-ne-katabilirim:hover {
    transform: translateX(-50%) scale(1.05);
}

/* =========================
   ORTA BOY EKRAN
========================= */

@media (max-width: 950px) {

    .sahne {
        width: 100%;
    }

    .deneyimler {
        left: 5%;
    }

    .programlar {
        right: 5%;
    }
}

/* =========================
   TELEFON
========================= */

@media (max-width: 650px) {

    html,
    body {
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
    }

    .ana-sayfa {
        width: 100%;
        min-height: 700px;
        height: auto;
    }

    /* =========================
       TELEFON BAŞLIĞI
    ========================= */

    header {
        padding-top: 25px;
    }

    .baslik-satiri {
        gap: 8px;
    }

    .baslik-satiri h1 {
        font-size: 30px;
        font-weight: 600;
    }

    .baslik-pati {
        width: 32px;
        height: 32px;
    }

    .baslik-kalp {
        width: 29px;
        height: 29px;
    }

    .unvan {
        font-size: 14px;
        line-height: 20px;
        padding: 0 20px;
        margin-top: 6px;
    }

    /* =========================
       TELEFON SAHNESİ
    ========================= */

    .sahne {
        position: relative;
        width: 100%;
        height: 570px;
        left: 0;
        top: 0;
        transform: none;
        margin-top: 5px;
    }

    /* Çocuklar */

    .cocuklar {
        width: 100px;
        top: 0;
    }

    /* Hakkımda */

    .hakkimda {
        left: 50%;
        top: 20px;
        transform: translateX(-50%);
        font-size: 15px;
        padding: 11px 20px;
    }

    .hakkimda:hover {
        transform: translateX(-50%) scale(1.05);
    }

    /* Fotoğraf */

    .foto-alani {
        width: 165px;
        height: 165px;
        left: 50%;
        top: 105px;
        transform: translateX(-50%);
    }

    /* Yan butonlar */

    .deneyimler {
        left: 10px;
        top: 295px;
        transform: none;
        font-size: 13px;
        padding: 11px 13px;
    }

    .deneyimler:hover {
        transform: scale(1.05);
    }

    .programlar {
        right: 5px;
        top: 295px;
        transform: none;
        font-size: 13px;
        padding: 11px 13px;
    }

    .programlar:hover {
        transform: scale(1.05);
    }

    /* Eğitim */

    .egitim {
        left: 50%;
        top: 365px;
        transform: translateX(-50%);
        font-size: 14px;
        padding: 11px 20px;
    }

    .egitim:hover {
        transform: translateX(-50%) scale(1.05);
    }

    /* Kedi */

    .kedi {
        width: 48px;
        top: 410px;
    }

    /* Not Defteri */

    .not-defteri {
        width: 110px;
        left: 8px;
        bottom: 10px;
    }

    /* Kalem */

    .kalem {
        width: 115px;
        right: 8px;
        bottom: 15px;
    }

    /* Size Ne Katabilirim */

    .size-ne-katabilirim {
        left: 50%;
        top: 460px;
        transform: translateX(-50%);
        font-size: 14px;
        padding: 12px 18px;
    }

    .size-ne-katabilirim:hover {
        transform: translateX(-50%) scale(1.05);
    }

}

</style>

</head>

<body>

<div class="ana-sayfa">

    <!-- =========================
         BAŞLIK
    ========================= -->

    <header>

        <div class="baslik-satiri">

            <img
                src="images/Pati.png"
                alt="Pati"
                class="baslik-pati"
            >

            <h1>Gülçin Torlakcık</h1>

            <img
                src="images/kalp.png"
                alt="Kalp"
                class="baslik-kalp"
            >

        </div>

        <div class="unvan">
            Halkla İlişkiler ve Reklam |
            Yaratıcı İçerik |
            Dijital Tasarım
        </div>

    </header>


    <!-- =========================
         ORTA ALAN
    ========================= -->

    <div class="sahne">


        <!-- ÇOCUKLAR -->

        <img
            src="images/cocuklar.jpeg"
            alt="Çocuklar"
            class="cocuklar"
        >


        <!-- HAKKIMDA -->

        <a
            href="hakkimda.html"
            class="buton hakkimda"
            onmouseenter="bakis('images/bakis_yukari.png')"
            onmouseleave="bakis('images/bakis_duz.png')"
        >
            Hakkımda
        </a>


        <!-- DENEYİMLERİM -->

        <a
            href="deneyimler.html"
            class="buton deneyimler"
            onmouseenter="bakis('images/bakis_sol.png')"
            onmouseleave="bakis('images/bakis_duz.png')"
        >
            Deneyimlerim
        </a>


        <!-- PROGRAMLAR -->

        <a
            href="programlar.html"
            class="buton programlar"
            onmouseenter="bakis('images/bakis_sag.png')"
            onmouseleave="bakis('images/bakis_duz.png')"
        >
            Programlar
        </a>


        <!-- EĞİTİM -->

        <a
            href="egitim.html"
            class="buton egitim"
            onmouseenter="bakis('images/bakis_asagi.png')"
            onmouseleave="bakis('images/bakis_duz.png')"
        >
            Eğitimim
        </a>


        <!-- FOTOĞRAF -->

        <div class="foto-alani">

            <div class="foto-cerceve">

                <img
                    id="profilFoto"
                    src="images/bakis_duz.png"
                    alt="Gülçin"
                >

            </div>

        </div>


        <!-- NOT DEFTERİ -->

        <img
            src="images/not defteri.png"
            alt="Not Defteri"
            class="not-defteri"
        >


        <!-- KALEM -->

        <img
            src="images/kalem.png"
            alt="Kalem"
            class="kalem"
        >


        <!-- KEDİ -->

        <img
            src="images/kedi.jpeg"
            alt="Kedi"
            class="kedi"
        >


        <!-- SIZE NE KATABİLİRİM? -->

        <a
            href="size-ne-katabilirim.html"
            class="buton size-ne-katabilirim"
            onmouseenter="bakis('images/goz_kirpma.png')"
            onmouseleave="bakis('images/bakis_duz.png')"
        >
            Size Ne Katabilirim?
        </a>


    </div>

</div>


<!-- =========================
     BAKIŞ DEĞİŞTİRME
========================= -->

<script>

function bakis(resim) {

    document.getElementById("profilFoto").src = resim;

}

</script>

</body>

</html>
